spring:
  application:
    name: gongmozip

  # 1. 데이터베이스 설정
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. Flyway 설정
  flyway:
    locations: classpath:db/migration  # 마이그레이션 SQL 파일 위치
    baseline-on-migrate: false         # flyway_schema_history 없을 때 baseline 자동 생성 안 함
    out-of-order: true                 # 낮은 버전 파일이 나중에 추가돼도 순서 무시하고 적용 허용

  # 3. JPA 설정 (Hibernate)
  jpa:
    hibernate:
      ddl-auto: validate # 엔티티 매핑과 DB 스키마 일치 여부만 검증
    show-sql: false
    open-in-view: false      # OSIV 비활성화
    properties:
      hibernate:
        format_sql: true     # SQL 예쁘게 출력

  # 4. Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 5. OAuth2 소셜 로그인 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 6. 이메일 설정 (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}  # 이메일 앱 비밀번호 입력
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # 7. 스케줄러 스레드풀 설정 — 기본값(1)이면 서로 무관한 @Scheduled job들이 스레드 하나를
  # 순서대로 나눠 써서, 한 job이 오래 걸리면 나머지 전부가 밀린다(스레드풀 점유 이슈 점검,
  # 2026-08-15). TeamSchedulerJobs/MatchingSchedulerJobs 등 서로 다른 도메인의 job이 동시에
  # 실행될 수 있도록 여유 있게 잡는다.
  task:
    scheduling:
      pool:
        size: 5

# Nginx 리버스 프록시의 X-Forwarded-* 헤더를 반영
server:
  forward-headers-strategy: framework

# 6. JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}      # 기본값: 1시간
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}  # 기본값: 14일

# 7. OAuth2 소셜 로그인 리다이렉트 URL
oauth2:
  redirect-url: ${OAUTH2_REDIRECT_URL} # 테스트용 스웨거 서버

# 8. AWS S3 설정
cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET}
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN}

# 9. AI(Gateway) 설정 - 키가 비어있으면 MockAiClient가 키워드 기반 응답으로 대체한다
ai:
  gateway:
    api-key: ${FACTCHAT_API_KEY:}
    base-url: ${FACTCHAT_BASE_URL:https://factchat-cloud.mindlogic.ai/v1/gateway}
    model: ${FACTCHAT_MODEL:gemini-2.5-flash}

# 10. QA용 팀 즉시 생성 엔드포인트(TeamTestController) 게이트 키 - 비어있으면(기본값) 항상 거부
test:
  api-key: ${TEST_API_KEY:}

matching:
  algorithm:
    # 운영값은 matchingBenchmark 결과로 조정한다.
    bruteforce-max-pool-size: ${MATCHING_BRUTEFORCE_MAX_POOL_SIZE:16}
    greedy-restart-count: ${MATCHING_GREEDY_RESTART_COUNT:50}
    fallback-reserve: ${MATCHING_FALLBACK_RESERVE:PT10M}
    batch-deadline: ${MATCHING_BATCH_DEADLINE:15:30}
    result-publish-time: ${MATCHING_RESULT_PUBLISH_TIME:16:00}
