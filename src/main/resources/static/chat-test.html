<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>채팅 WebSocket 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  fieldset { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 6px; font-size: 14px; }
  button { margin-top: 8px; padding: 6px 14px; cursor: pointer; }
  #status { font-weight: bold; }
  #status.connected { color: #16a34a; }
  #status.disconnected { color: #dc2626; }
  #log { border: 1px solid #ddd; border-radius: 6px; padding: 8px; height: 140px; overflow-y: auto; background: #fafafa; font-size: 12px; color: #777; }
  .entry { margin-bottom: 4px; }
  .entry .time { color: #999; margin-right: 6px; }
  .entry.error { color: #dc2626; }

  #chatWindow { border: 1px solid #ddd; border-radius: 6px; padding: 12px; height: 380px; overflow-y: auto; background: #fff; display: flex; flex-direction: column; gap: 8px; }
  .bubble-row { display: flex; flex-direction: column; max-width: 75%; }
  .bubble-row.member { align-self: flex-start; }
  .bubble-row.chatbot { align-self: flex-start; }
  .bubble-row.system { align-self: center; max-width: 90%; }
  .bubble-sender { font-size: 11px; color: #888; margin-bottom: 2px; padding: 0 4px; }
  .bubble { padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
  .bubble-row.member .bubble { background: #f1f3f5; color: #111; border-bottom-left-radius: 4px; }
  .bubble-row.chatbot .bubble { background: #ede9fe; color: #4c1d95; border-bottom-left-radius: 4px; }
  .bubble-row.system .bubble { background: #f3f4f6; color: #6b7280; font-size: 12px; font-style: italic; border-radius: 999px; padding: 4px 12px; text-align: center; }
  .bubble-time { font-size: 10px; color: #aaa; margin-top: 2px; padding: 0 4px; }
</style>
</head>
<body>
<h2>채팅 WebSocket 수동 테스트</h2>
<p>Phase 4 개발 전 STOMP 연결/전송/수신 동작을 눈으로 확인하기 위한 로컬 테스트 페이지입니다.</p>

<fieldset>
  <legend>연결 설정</legend>
  <label for="token">JWT Access Token (Bearer 제외, 순수 토큰)</label>
  <input type="text" id="token" placeholder="/api/auth/login 응답의 accessToken" />

  <label for="teamId">Team ID</label>
  <input type="text" id="teamId" placeholder="예: 1" />

  <button id="connectBtn">연결</button>
  <button id="disconnectBtn" disabled>연결 종료</button>
  <span id="status" class="disconnected">연결 안 됨</span>
</fieldset>

<fieldset>
  <legend>채팅창</legend>
  <div id="chatWindow"></div>
  <textarea id="content" rows="2" placeholder="메시지 내용" disabled></textarea>
  <button id="sendBtn" disabled>전송</button>
</fieldset>

<fieldset>
  <legend>연결 로그 (디버그용)</legend>
  <div id="log"></div>
</fieldset>

<script>
  let client = null;
  let teamSubscription = null;
  let errorSubscription = null;

  const $ = (id) => document.getElementById(id);
  const logEl = $('log');
  const chatWindowEl = $('chatWindow');

  function log(text, cls) {
    const entry = document.createElement('div');
    entry.className = 'entry ' + (cls || '');
    const time = new Date().toLocaleTimeString();
    entry.innerHTML = '<span class="time">[' + time + ']</span>' + escapeHtml(text);
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // senderType: MEMBER / CHATBOT / SYSTEM
  function renderMessage(body) {
    const row = document.createElement('div');
    const typeClass = (body.senderType || 'member').toLowerCase();
    row.className = 'bubble-row ' + typeClass;

    if (typeClass !== 'system') {
      const sender = document.createElement('div');
      sender.className = 'bubble-sender';
      sender.textContent = body.senderNickname || (typeClass === 'chatbot' ? '챗봇' : '알 수 없음');
      row.appendChild(sender);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = body.content || '';
    row.appendChild(bubble);

    if (typeClass !== 'system') {
      const time = document.createElement('div');
      time.className = 'bubble-time';
      time.textContent = body.createdAt ? new Date(body.createdAt).toLocaleTimeString() : new Date().toLocaleTimeString();
      row.appendChild(time);
    }

    chatWindowEl.appendChild(row);
    chatWindowEl.scrollTop = chatWindowEl.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function setConnected(connected) {
    $('status').textContent = connected ? '연결됨' : '연결 안 됨';
    $('status').className = connected ? 'connected' : 'disconnected';
    $('connectBtn').disabled = connected;
    $('disconnectBtn').disabled = !connected;
    $('content').disabled = !connected;
    $('sendBtn').disabled = !connected;
  }

  // 채팅방 생성 시점에 이미 발행된 챗봇 인사 메시지 등은 실시간 구독으로는 볼 수 없으므로
  // (구독 전에 이미 브로드캐스트됨), 연결 시 과거 메시지를 먼저 불러와 채운다.
  async function loadMessageHistory(token, teamId) {
    const res = await fetch('/api/teams/' + teamId + '/messages', {
      headers: { Authorization: 'Bearer ' + token },
    });
    if (!res.ok) throw new Error('메시지 내역 조회 실패: ' + res.status);
    const { data } = await res.json();
    // 서버는 최신순으로 내려주므로 화면에는 오래된 순으로 뒤집어서 표시한다.
    data.messages.slice().reverse().forEach(renderMessage);
  }

  $('connectBtn').addEventListener('click', async () => {
    const token = $('token').value.trim();
    const teamId = $('teamId').value.trim();
    if (!token || !teamId) {
      alert('토큰과 Team ID를 입력해주세요.');
      return;
    }

    chatWindowEl.innerHTML = '';
    try {
      await loadMessageHistory(token, teamId);
    } catch (e) {
      log('메시지 내역 조회 실패: ' + e.message, 'error');
    }

    const wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const brokerURL = wsProtocol + location.host + '/ws';

    client = new StompJs.Client({
      brokerURL,
      connectHeaders: { Authorization: 'Bearer ' + token },
      debug: () => {},
      reconnectDelay: 0,
      onConnect: () => {
        log('STOMP 연결 성공');
        setConnected(true);

        teamSubscription = client.subscribe('/topic/teams/' + teamId, (message) => {
          const body = JSON.parse(message.body);
          renderMessage(body);
        });

        errorSubscription = client.subscribe('/user/queue/errors', (message) => {
          log('오류: ' + message.body, 'error');
        });
      },
      onStompError: (frame) => {
        log('STOMP 오류: ' + frame.headers['message'], 'error');
      },
      onWebSocketClose: () => {
        log('연결이 종료되었습니다.');
        setConnected(false);
      },
    });

    log('연결 시도 중... (' + brokerURL + ')', 'system');
    client.activate();
  });

  $('disconnectBtn').addEventListener('click', () => {
    if (teamSubscription) teamSubscription.unsubscribe();
    if (errorSubscription) errorSubscription.unsubscribe();
    if (client) client.deactivate();
    setConnected(false);
  });

  $('sendBtn').addEventListener('click', () => {
    const teamId = $('teamId').value.trim();
    const content = $('content').value.trim();
    if (!content || !client || !client.connected) return;

    client.publish({
      destination: '/app/teams/' + teamId + '/messages',
      body: JSON.stringify({ content }),
    });
    $('content').value = '';
  });
</script>
</body>
</html>
