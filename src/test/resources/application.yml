spring:
  application:
    name: gongmozip

  # 1. 데이터베이스 설정 (H2 인메모리)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 2. JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 3. Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # 4. 이메일 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: no-reply@gongmozip.com
    password: testpassword
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # 5. OAuth2 소셜 로그인 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - profile
              - email
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 6. JWT 설정
jwt:
  secret: testsecretkeytestsecretkeytestsecretkeytestsecretkeytestsecretkey
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

# 7. OAuth2 리다이렉트 URL
oauth2:
  redirect-url: http://localhost:3000

# 8. AWS S3 설정
cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: gongmozip-contest-images
    cloudfront:
      domain: https://d123456abcdef.cloudfront.net