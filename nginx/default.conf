upstream gongmozip_backend {
    server app:8080;
    keepalive 32;
}

# WebSocket(STOMP, /ws) 핸드셰이크를 위해 Upgrade 요청에서만 Connection을 "upgrade"로 바꿔준다.
# 일반 HTTP 요청(Upgrade 헤더 없음)은 그대로 close로 둬서 keepalive 동작에 영향을 주지 않는다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 13.209.254.149.nip.io api.gongmozip.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.gongmozip.site$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name api.gongmozip.site;

    ssl_certificate /etc/letsencrypt/live/api.gongmozip.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gongmozip.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    location / {
        proxy_pass http://gongmozip_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}