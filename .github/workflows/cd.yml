name: Gongmozip Backend CD

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gongmozip-backend:${{ steps.image.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gongmozip-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USERNAME@$EC2_HOST" "mkdir -p ~/gongmozip/nginx"
          scp -i ~/.ssh/ec2_key docker-compose.prod.yml "$EC2_USERNAME@$EC2_HOST:~/gongmozip/"
          scp -i ~/.ssh/ec2_key nginx/default.conf "$EC2_USERNAME@$EC2_HOST:~/gongmozip/nginx/"

      - name: Clean up unused Docker images before pull
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USERNAME@$EC2_HOST" "docker image prune -af"

      - name: Pull image and restart services
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i ~/.ssh/ec2_key "$EC2_USERNAME@$EC2_HOST" \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"
          ssh -i ~/.ssh/ec2_key "$EC2_USERNAME@$EC2_HOST" \
            "cd ~/gongmozip && DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml pull && DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml up -d --remove-orphans"

      # nginx/default.conf는 bind mount(:ro)라 내용만 바뀌면 compose가 변경으로 인식하지 못해
      # `up -d`만으로는 재시작되지 않는다 - 매 배포마다 무조건 재시작해 최신 설정을 반영한다
      # (이슈 #122: PR #121의 WebSocket Upgrade 헤더 설정이 배포됐는데도 반영 안 됐던 문제).
      - name: Restart nginx to pick up latest config
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USERNAME@$EC2_HOST" \
            "cd ~/gongmozip && docker compose -f docker-compose.prod.yml restart nginx"

      - name: Verify server and Swagger
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USERNAME@$EC2_HOST" '
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://localhost/v3/api-docs > /dev/null && \
                 curl --fail --silent http://localhost/swagger-ui/index.html > /dev/null; then
                exit 0
              fi
              sleep 5
            done
            docker logs --tail=100 gongmozip-app || true
            docker logs --tail=100 gongmozip-nginx || true
            exit 1
          '